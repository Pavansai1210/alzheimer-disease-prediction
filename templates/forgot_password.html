{% extends "base_modern.html" %}

{% block title %}Reset Password - REMDEX AI{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; width: 100%;">
    <div class="glass-card">
        <div class="text-center mb-4">
            <h2 class="gradient-text" style="font-size: 2rem;">Forgot Password?</h2>
            <p class="text-muted">No worries, it happens. Enter your email to reset it.</p>
        </div>

        <form action="{{ url_for('forgot_password') }}" method="POST">
            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-control-modern"
                    placeholder="Enter your registered email" required>
            </div>

            <button type="submit" class="btn-modern btn-primary-modern" style="width: 100%; margin-top: 1rem;">
                Send Reset Link
            </button>
        </form>

        <div class="text-center mt-4">
            <p class="text-muted" style="font-size: 0.9rem;">
                Remember your password? <a href="{{ url_for('login') }}"
                    style="color: var(--primary); text-decoration: none; font-weight: 600;">Back to Login</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
